name: Deploy ACRE to OVH

on:
  workflow_dispatch:

concurrency:
  group: acre-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy over SFTP
    runs-on: ubuntu-latest
    env:
      SFTP_HOST: ftp.cluster121.hosting.ovh.net
      SFTP_PORT: "22"
      SFTP_USER: acrewog
      SFTP_REMOTE_DIR: www

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment secret
        shell: bash
        env:
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SFTP_PASSWORD:-}" ]; then
            echo "::error::SFTP_PASSWORD is not configured in GitHub Actions secrets."
            exit 1
          fi

      - name: Install lftp
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Upload website to OVH
        shell: bash
        env:
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          set -euo pipefail

          lftp -u "$SFTP_USER","$SFTP_PASSWORD" "sftp://$SFTP_HOST:$SFTP_PORT" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set sftp:auto-confirm yes
          set mirror:set-permissions no

          mirror --reverse --verbose --parallel=4 \
            --exclude-glob .git/ \
            --exclude-glob .git/** \
            --exclude-glob .github/ \
            --exclude-glob .github/** \
            ./ "$SFTP_REMOTE_DIR"

          bye
          LFTP

      - name: Deployment completed
        run: echo "ACRE deployment to OVH completed successfully."
